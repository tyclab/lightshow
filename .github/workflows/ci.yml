name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Node 24 is the LTS target and the oldest supported; 26 is the next LTS.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    name: check (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # The server is TypeScript run by Node's type stripping, which checks
      # nothing — this is where the types are checked.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Render budgets without competing test processes
        run: npm run test:performance

      # The client bundle is generated, not committed — make sure it still builds.
      - name: Build client
        run: npm run build:client

  # Real-server browser checks use isolated config and disable outputs.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        # Measured on 2026-11-11: the runner's resolver timed out for Ubuntu's
        # package mirrors for over an hour while public resolvers answered.
        # When the mirror does not resolve, public resolvers go in front of the
        # runner's; the install is retried for shorter faults.
        run: |
          link=$(ip route show default | awk '{print $5; exit}')
          for attempt in 1 2 3; do
            if ! timeout 15 getent hosts azure.archive.ubuntu.com >/dev/null; then
              echo "::warning::the runner's resolver does not answer for the package mirror; adding public resolvers"
              sudo resolvectl dns "$link" 1.1.1.1 9.9.9.9 168.63.129.16
              sudo resolvectl flush-caches
            fi
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: '1'

      - name: Keep the traces of what failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Exercise model-backed analysis on synthetic audio using CPU torch.
  # Cache model weights; PANNs remains optional and bootstrap-tested separately.
  python:
    runs-on: ubuntu-latest
    env:
      # No GPU on a runner, and saying so skips the CUDA probe.
      ARTNET_ANALYSIS_DEVICE: cpu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'
          cache: pip

      # Same index for both: a torchaudio built against another torch fails its native load and every model test errors.
      - name: Install torch and torchaudio (CPU build)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip freeze | grep -E '^(torch|torchaudio)==' > /tmp/torch-constraints.txt
          cat /tmp/torch-constraints.txt

      # Prevent model dependencies from replacing the installed torch pair.
      - name: Install the analysis dependencies
        run: pip install -c /tmp/torch-constraints.txt
             numpy scipy scikit-learn soundfile librosa threadpoolctl
             beat_this demucs

      # Fail fast and legibly. The native extension only loads when the pair
      # matches, and finding that out from eighteen test errors wastes a cycle.
      - name: Verify the model stack imports
        run: |
          python -c "import torch, torchaudio; print('torch', torch.__version__, '| torchaudio', torchaudio.__version__)"

      # Cache weights by models.py: Beat This! uses torch hub, Demucs Hugging Face.
      - name: Cache model checkpoints
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
          key: model-checkpoints-${{ hashFiles('src/analysis/models.py') }}
          restore-keys: model-checkpoints-

      # Load directly: warm_up intentionally swallows optional model failures.
      - name: Fetch model weights
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          from analysis import models
          print('beat tracker:', type(models.beat_tracker()).__name__)
          print('separator:', type(models.separator()).__name__)
          "

      - name: Compile every module
        run: python -m compileall -q src scripts tests

      - name: Analysis tests
        run: python -m unittest discover -s tests/python -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Runtime dependencies only: a dev-only advisory should not fail a show tool's CI.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev

  # The one check the ruleset on main requires, so its name survives a change of
  # the Node matrix. A job that is not in `needs` does not hold a merge back
  # (tests/unit/ci-gate.test.js). `always()`: a failed job would otherwise leave
  # this one skipped, and a skipped required check counts as passed.
  gate:
    if: always()
    needs: [check, e2e, python, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
