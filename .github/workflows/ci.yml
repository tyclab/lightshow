name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Node 24 is the LTS target and the oldest supported; 26 is the next LTS.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    name: check (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # The server is TypeScript run by Node's type stripping, which checks
      # nothing — this is where the types are checked.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Render budgets without competing test processes
        run: npm run test:performance

      # The client bundle is generated, not committed — make sure it still builds.
      - name: Build client
        run: npm run build:client

  # Real-server browser checks use isolated config and disable outputs.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        # Measured on 2026-11-11: the runner's resolver timed out for Ubuntu's
        # package mirrors for over an hour while public resolvers answered.
        # When the mirror does not resolve, public resolvers go in front of the
        # runner's; the install is retried for shorter faults.
        run: |
          link=$(ip route show default | awk '{print $5; exit}')
          for attempt in 1 2 3; do
            if ! timeout 15 getent hosts azure.archive.ubuntu.com >/dev/null; then
              echo "::warning::the runner's resolver does not answer for the package mirror; adding public resolvers"
              sudo resolvectl dns "$link" 1.1.1.1 9.9.9.9 168.63.129.16
              sudo resolvectl flush-caches
            fi
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: '1'

      - name: Keep the traces of what failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # The live input's Python on synthetic audio: the service, its streaming
  # analyser and the launcher the server starts.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
          cache: pip

      # soundcard and sounddevice need audio libraries the runner lacks; the tests read files and fake the devices.
      - name: Install the live input's dependencies
        run: pip install numpy librosa soundfile

      - name: Compile every module
        run: python -m compileall -q src scripts tests

      - name: Live input tests
        run: python -m unittest discover -s tests/python -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Runtime dependencies only: a dev-only advisory should not fail a show tool's CI.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev

  # The one check the ruleset on main requires, so its name survives a change of
  # the Node matrix. A job that is not in `needs` does not hold a merge back
  # (tests/unit/ci-gate.test.js). `always()`: a failed job would otherwise leave
  # this one skipped, and a skipped required check counts as passed.
  gate:
    if: always()
    needs: [check, e2e, python, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
